<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="PROSE™ Sovereign Editorial Suite loader with Template Mini-Cloud support.">
  <meta name="theme-color" content="#191611">
  <title>PROSE™ — Sovereign Editorial Suite</title>
</head>
<body>
<noscript>PROSE requires JavaScript to load the local-first editorial suite.</noscript>
<script>
(async function(){
  'use strict';

  const CORE_URL = './PROSE_editor_core.html';

  function requiredReplace(source, before, after, label){
    if(!source.includes(before)){
      throw new Error('PROSE Mini-Cloud compatibility marker missing: ' + label);
    }
    return source.replace(before, after);
  }

  try{
    const response = await fetch(CORE_URL, {cache:'no-store', credentials:'same-origin'});
    if(!response.ok) throw new Error('Unable to load PROSE editor core (' + response.status + ').');
    let html = await response.text();

    html = requiredReplace(
      html,
      'const candidates=["../templates/manifest.json","./templates/manifest.json"];',
      'const candidates=["../templates/mini-cloud.json","./templates/mini-cloud.json","../templates/manifest.json","./templates/manifest.json"];',
      'template registry candidates'
    );

    html = requiredReplace(
      html,
      'const manifest=await response.json();\n        if(!manifest||!Array.isArray(manifest.templates))throw new Error("Manifest does not contain a templates array.");',
      `let manifest=await response.json();
        if(manifest&&manifest.schema==="prose-template-mini-cloud"){
          const mergedTemplates=[];
          const mergedCategories=[];
          const seenCategories=new Set();
          const addCategory=value=>{
            const category=asString(value,200).trim();
            if(category&&!seenCategories.has(category)){
              seenCategories.add(category);
              mergedCategories.push(category);
            }
          };
          for(const source of Array.isArray(manifest.sources)?manifest.sources:[]){
            const sourcePath=asString(source?.manifest,500).trim();
            if(!sourcePath)continue;
            const sourceUrl=new URL(sourcePath,manifestUrl);
            if(sourceUrl.origin!==location.origin)continue;
            const sourceResponse=await fetch(sourceUrl,{cache:"no-store",credentials:"same-origin"});
            if(!sourceResponse.ok)continue;
            const sourceManifest=await sourceResponse.json();
            (Array.isArray(sourceManifest?.categories)?sourceManifest.categories:[]).forEach(addCategory);
            (Array.isArray(sourceManifest?.templates)?sourceManifest.templates:[]).forEach(record=>{
              if(record&&typeof record==="object")mergedTemplates.push({...record,__manifestUrl:sourceUrl.href});
            });
          }
          (Array.isArray(manifest.extensions)?manifest.extensions:[]).forEach(record=>{
            if(record&&typeof record==="object"){
              addCategory(record.category);
              mergedTemplates.push({...record,__manifestUrl:manifestUrl.href});
            }
          });
          manifest={...manifest,categories:mergedCategories,templates:mergedTemplates};
        }
        if(!manifest||!Array.isArray(manifest.templates))throw new Error("Manifest does not contain a templates array.");`,
      'Mini-Cloud manifest expansion'
    );

    html = requiredReplace(
      html,
      'manifest.templates.slice(0,100).forEach(raw=>{',
      'manifest.templates.forEach(raw=>{',
      'template-count ceiling'
    );

    html = requiredReplace(
      html,
      'description:asString(raw?.description,1200).trim()||"Repository template.",\n            manifestUrl:manifestUrl.href',
      'description:asString(raw?.description,1200).trim()||"Repository template.",\n            category:asString(raw?.category,200).trim()||"Other",\n            manifestUrl:asString(raw?.__manifestUrl,2000).trim()||manifestUrl.href',
      'template category and source metadata'
    );

    html = requiredReplace(
      html,
      '"<option value=\'repo:"+escapeHtml(item.id)+"\'>"+escapeHtml(item.title)+"</option>"',
      '"<option value=\'repo:"+escapeHtml(item.id)+"\'>"+escapeHtml((item.category?item.category+" · ":"")+item.title)+"</option>"',
      'category-aware template labels'
    );

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML = '<main style="max-width:777px;margin:55px auto;padding:24px;font-family:system-ui,sans-serif;line-height:1.55"><h1>PROSE could not open</h1><p>The preserved editor core was not changed. The Mini-Cloud compatibility loader stopped rather than loading an uncertain build.</p><pre style="white-space:pre-wrap;background:#f4f0e7;padding:14px;border-radius:7px"></pre></main>';
    const pre=document.querySelector('pre');
    if(pre)pre.textContent=String(error&&error.message?error.message:error);
    console.error(error);
  }
})();
</script>
<script src="/assets/vnv-beta-link.js" defer></script>
</body>
</html>
